# nginx i client-imagen: skickar ut de byggda filerna. (Proxyn för API-anropen kommer i steg 2.)
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /api/ {
    proxy_pass http://api:4000;
  }
  location /graphql {
    proxy_pass http://api:4000;
  }
}
